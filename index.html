<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mivoyage Cricket</title>
<style>
:root{
  --bg:#0b1f14; --card:#12301f; --card2:#184028; --line:#235a3a;
  --text:#eaf5ee; --mute:#8fb5a0; --accent:#3ddc84; --accent-ink:#04210f;
  --red:#ff5a5f; --blue:#4da3ff; --gold:#ffc83d; --orange:#ff9f43;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.3px;flex:1}
header h1 span{color:var(--accent)}
.icon-btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;
  width:40px;height:40px;font-size:20px;cursor:pointer}
main{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.score-card{background:linear-gradient(160deg,#1a4a2e,#0f2c1b);text-align:center}
.team{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.big{font-size:54px;font-weight:800;line-height:1.05;margin:4px 0}
.big small{font-size:22px;color:var(--mute);font-weight:600}
.sub{color:var(--mute);font-size:13px}
.sub b{color:var(--text)}
.chase{margin-top:8px;padding:6px 10px;background:rgba(0,0,0,.25);border-radius:10px;font-size:13px}
.balls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;min-height:30px}
.b{min-width:30px;height:30px;padding:0 6px;border-radius:15px;display:inline-flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.b.w{background:var(--red);border-color:var(--red);color:#fff}
.b.f{background:var(--blue);border-color:var(--blue);color:#021428}
.b.s{background:var(--gold);border-color:var(--gold);color:#2b1d00}
.b.x{background:var(--orange);border-color:var(--orange);color:#2b1400}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;text-align:right;padding:4px 0}
td{padding:7px 0;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
td.n{font-weight:600}
td .out{display:block;color:var(--mute);font-size:11px;font-weight:400}
.strike{color:var(--accent)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;
  padding:10px 0;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--orange);border-color:var(--orange);color:#2b1400}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{height:62px;font-size:22px;font-weight:700;border-radius:14px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);cursor:pointer}
.pad button:disabled,.btn:disabled{opacity:.4}
.pad button:active,.chip:active{transform:scale(.96)}
.pad .four{background:var(--blue);color:#021428;border-color:var(--blue)}
.pad .six{background:var(--gold);color:#2b1d00;border-color:var(--gold)}
.pad .wk{background:var(--red);color:#fff;border-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 16px;
  font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn.sm{padding:9px 14px;font-size:14px;width:auto}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;
  background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:12px 0;font-size:13px;font-weight:600;cursor:pointer}
nav button.on{color:var(--accent)}
h2{font-size:14px;margin:0 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;
  padding:12px;font-size:16px;font-family:inherit}
textarea{min-height:170px}
.over{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.over:first-of-type{border-top:0}
.over .no{width:28px;color:var(--mute);font-size:12px}
.over .who{width:84px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.over .balls{margin:0;justify-content:flex-start;flex:1;min-height:0}
.over .tot{font-weight:700;width:28px;text-align:right}
.result{background:var(--accent);color:var(--accent-ink);text-align:center;font-weight:800;font-size:17px;padding:14px;border-radius:14px}
.fow{color:var(--mute);font-size:12px;line-height:1.6;margin-top:6px}
.empty{color:var(--mute);text-align:center;padding:20px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;border:1px solid var(--line)}
.sheet h3{margin:0 0 4px;font-size:18px}
.opts{display:grid;gap:8px;margin-top:10px}
.runs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
/* fixtures + teams */
.fx{display:flex;flex-direction:column;gap:10px}
.fx-top{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--accent-ink);background:var(--gold);padding:3px 9px;border-radius:8px}
.tag.live{background:var(--red);color:#fff}.tag.done{background:var(--accent)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs b{font-size:17px}.vs i{color:var(--mute);font-style:normal;font-size:12px}
.line{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.line b{color:var(--text)}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:6px}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plist span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px}
.plist span.c{border-color:var(--gold);color:var(--gold)}
.tr{display:flex;justify-content:space-between;align-items:center}
.pts{font-weight:800;color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
"use strict";
const KEY = "cric-warriors-v2";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- storage ---------- */
function defaults(){
  return {
    overs: 6,
    teams: [
      {name:"Avengers", tag:"Team Vamsi",    color:"#4da3ff", players:["Vamsi","Bharathi","Hemanth Sagar","Hemanath","Karthik","Vinod","Mirza"]},
      {name:"Warriors", tag:"Team Niranjan", color:"#ff9f43", players:["Niranjan","Anand","Dhruva","Sai","Murali (AI)","Sneha","Mirza"]},
      {name:"Legends",  tag:"Team Pavan",    color:"#c26bff", players:["Pavan","Aryan","Vamshi (dev)","Deepika","Rithvik","Murali","Mirza"]}
    ],
    fixtures: [
      {id:"f1", label:"Match 1", a:0, b:2},
      {id:"f2", label:"Match 2", a:1, b:2},
      {id:"f3", label:"Match 3", a:1, b:0}
    ],
    matches: [], activeId: null
  };
}
let DB = load();
let hist = loadHist();
let S = DB.matches.find(m => m.id === DB.activeId) || null;   // active match
let view = S ? "match" : "home";
let htab = "matches";      // home tab: matches | teams | table
let tab = "score";         // match tab: score | card | overs
let mod = null;            // pending extra: wd | nb | b | lb

function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.teams) return d; } catch(e){}
  return defaults();
}
function loadHist(){ try { return JSON.parse(localStorage.getItem(KEY + "-hist")) || []; } catch(e){ return []; } }
function save(){
  try { DB.activeId = view === "match" && S ? S.id : null;
    localStorage.setItem(KEY, JSON.stringify(DB)); localStorage.setItem(KEY + "-hist", JSON.stringify(hist)); } catch(e){}
}
addEventListener("pagehide", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

function snapshot(){ hist.push(JSON.stringify(S)); if (hist.length > 80) hist.shift(); }

/* ---------- helpers ---------- */
const inn = () => S.inn[S.cur];
const oversStr = b => Math.floor(b/6) + "." + (b%6);
const batTeam = i => S.teams[i.bat];
const bowlTeam = i => S.teams[1 - i.bat];
const rate = (r, b) => b ? (r*6/b).toFixed(2) : "0.00";
const sr = (r, b) => b ? (r*100/b).toFixed(0) : "-";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const tm = id => DB.teams[id];

function newInnings(bat){
  return { bat, runs:0, wkts:0, balls:0, extras:{wd:0,nb:0,b:0,lb:0},
    batters:[], bowlers:[], ov:[], fow:[], striker:null, non:null, bowler:null, ended:false };
}
function getBatter(i, name){
  let p = i.batters.find(x => x.name === name);
  if (!p){ p = {name, r:0, b:0, f:0, s:0, out:null}; i.batters.push(p); }
  return p;
}
function getBowler(i, name){
  let p = i.bowlers.find(x => x.name === name);
  if (!p){ p = {name, b:0, r:0, w:0}; i.bowlers.push(p); }
  return p;
}

/* ---------- scoring ---------- */
function ball(runs, ext, wk){
  const i = inn();
  if (i.ended || !i.striker || !i.non || !i.bowler) return;
  snapshot();
  const st = getBatter(i, i.striker), bw = getBowler(i, i.bowler);
  let total = runs, legal = true, tok = String(runs);

  if (ext === "wd"){
    total = runs + 1; legal = false; i.extras.wd += total; bw.r += total;
    tok = (runs ? runs : "") + "wd";
  } else if (ext === "nb"){
    total = runs + 1; legal = false; i.extras.nb += 1; bw.r += total;
    st.r += runs; st.b++; if (runs === 4) st.f++; if (runs === 6) st.s++;
    tok = "nb" + (runs ? "+" + runs : "");
  } else if (ext === "b" || ext === "lb"){
    i.extras[ext] += runs; st.b++; tok = runs + ext;
  } else {
    st.r += runs; st.b++; bw.r += runs;
    if (runs === 4) st.f++; if (runs === 6) st.s++;
  }
  i.runs += total;
  if (legal){ i.balls++; bw.b++; }

  let o = i.ov[i.ov.length-1];
  if (!o || o.closed){ o = {bowler:i.bowler, t:[], runs:0, closed:false}; i.ov.push(o); }
  o.runs += total;

  if (runs % 2 === 1) [i.striker, i.non] = [i.non, i.striker];

  if (wk){
    const outName = wk.who === "non" ? (runs % 2 === 1 ? i.striker : i.non) : (runs % 2 === 1 ? i.non : i.striker);
    const p = getBatter(i, outName);
    p.out = wk.how === "Run out" ? "run out" : wk.how.toLowerCase() + " b " + i.bowler;
    if (wk.how !== "Run out") bw.w++;
    i.wkts++;
    i.fow.push(i.runs + "-" + i.wkts + " (" + outName + ", " + oversStr(i.balls) + " ov)");
    if (i.striker === outName) i.striker = null; else i.non = null;
    tok += "W";
  }
  o.t.push(tok);

  if (legal && i.balls % 6 === 0){
    o.closed = true;
    [i.striker, i.non] = [i.non, i.striker];
    i.bowler = null;
  }
  mod = null;
  checkEnd();
  render();
}

function checkEnd(){
  const i = inn(), maxW = S.players - 1;
  let reason = null;
  if (i.wkts >= maxW) reason = "All out";
  else if (i.balls >= S.overs * 6) reason = "Overs complete";
  else if (S.cur === 1 && i.runs >= S.inn[0].runs + 1) reason = "Target reached";
  if (reason) endInnings(reason);
}

function endInnings(){
  const i = inn();
  i.ended = true;
  if (S.cur === 0){
    S.phase = "break";
  } else {
    const a = S.inn[0], b = S.inn[1], tgt = a.runs + 1;
    const wl = S.players - 1 - b.wkts;
    if (b.runs >= tgt){ S.winner = b.bat; S.result = batTeam(b) + " won by " + wl + " wicket" + (wl === 1 ? "" : "s"); }
    else if (b.runs === a.runs){ S.winner = -1; S.result = "Match tied"; }
    else { S.winner = a.bat; S.result = batTeam(a) + " won by " + (a.runs - b.runs) + " run" + (a.runs - b.runs === 1 ? "" : "s"); }
    S.phase = "done";
  }
}

function undo(){
  if (!hist.length) return;
  const idx = DB.matches.findIndex(m => m.id === S.id);
  S = JSON.parse(hist.pop());
  DB.matches[idx] = S;
  mod = null;
  render();
}
function swapStrike(){
  const i = inn(); if (i.ended || !i.striker || !i.non) return;
  snapshot(); [i.striker, i.non] = [i.non, i.striker]; render();
}
function setMod(m){ mod = mod === m ? null : m; render(); }
function startSecond(){
  snapshot();
  S.cur = 1; S.inn.push(newInnings(1 - S.inn[0].bat)); S.phase = "play"; render();
}

/* ---------- matches ---------- */
function openMatch(id){
  if (!S || S.id !== id) hist = [];
  S = DB.matches.find(m => m.id === id); view = "match"; tab = "score"; mod = null; render();
}
function goHome(){ view = "home"; S = null; hist = []; render(); }

function startSheet(fid){
  const fx = DB.fixtures.find(f => f.id === fid);
  const opts = (sel) => DB.teams.map((t,n) => `<option value="${n}" ${n===sel?"selected":""}>${esc(t.name)}</option>`).join("");
  const a = fx ? fx.a : 0, b = fx ? fx.b : 1;
  openSheet(`<h3>${fx ? esc(fx.label) : "New match"}</h3>
    <form onsubmit="createMatch(event,'${fid||""}')">
      <div class="row2">
        <div><label>Team 1</label><select name="a" id="sa" onchange="syncToss()">${opts(a)}</select></div>
        <div><label>Team 2</label><select name="b" id="sb" onchange="syncToss()">${opts(b)}</select></div>
      </div>
      <div class="row2">
        <div><label>Overs per side</label><input name="overs" type="number" inputmode="numeric" min="1" max="100" value="${DB.overs}"></div>
        <div><label>Players per side</label><input name="players" type="number" inputmode="numeric" min="2" max="11" value="${Math.min(tm(a).players.length, tm(b).players.length) || 7}"></div>
      </div>
      <div class="row2">
        <div><label>Toss won by</label><select name="toss" id="st"></select></div>
        <div><label>Elected to</label><select name="elect"><option value="bat">Bat</option><option value="bowl">Bowl</option></select></div>
      </div>
      <div style="height:16px"></div>
      <div class="opts"><button class="btn" type="submit">Start match</button>
      <button class="btn ghost" type="button" onclick="closeSheet()">Cancel</button></div>
    </form>`);
  syncToss();
}
function syncToss(){
  const a = +$("#sa").value, b = +$("#sb").value, st = $("#st"), prev = st.value;
  st.innerHTML = `<option value="0">${esc(tm(a).name)}</option><option value="1">${esc(tm(b).name)}</option>`;
  if (prev) st.value = prev;
}
function createMatch(e, fid){
  e.preventDefault();
  const f = new FormData(e.target);
  const a = +f.get("a"), b = +f.get("b");
  if (a === b){ alert("Pick two different teams."); return; }
  const toss = +f.get("toss"), bats = f.get("elect") === "bat";
  const first = bats ? toss : 1 - toss;
  const overs = Math.max(1, +f.get("overs") || 6);
  DB.overs = overs;
  const m = { id: uid(), fid: fid || null, teamIds:[a,b], teams:[tm(a).name, tm(b).name],
    squad:[tm(a).players.slice(), tm(b).players.slice()],
    overs, players: Math.min(11, Math.max(2, +f.get("players") || 7)),
    cur:0, inn:[newInnings(first)], phase:"play", result:"", winner:null, ts:Date.now() };
  DB.matches.push(m);
  closeSheet(); hist = []; openMatch(m.id);
}
function deleteMatch(id){
  DB.matches = DB.matches.filter(m => m.id !== id);
  closeSheet(); goHome();
}

/* ---------- standings ---------- */
function standings(){
  const row = DB.teams.map((t,id) => ({id, name:t.name, p:0, w:0, l:0, t:0, pts:0, rf:0, bf:0, ra:0, bb:0}));
  DB.matches.filter(m => m.phase === "done").forEach(m => {
    m.teamIds.forEach((id,k) => {
      const r = row[id]; r.p++;
      if (m.winner === -1){ r.t++; r.pts += 1; }
      else if (m.winner === k){ r.w++; r.pts += 2; } else r.l++;
    });
    m.inn.forEach(i => {
      const faced = i.wkts >= m.players - 1 ? m.overs * 6 : i.balls;
      const bat = row[m.teamIds[i.bat]], bowl = row[m.teamIds[1 - i.bat]];
      bat.rf += i.runs; bat.bf += faced; bowl.ra += i.runs; bowl.bb += faced;
    });
  });
  row.forEach(r => r.nrr = (r.bf ? r.rf*6/r.bf : 0) - (r.bb ? r.ra*6/r.bb : 0));
  return row.sort((a,b) => b.pts - a.pts || b.nrr - a.nrr);
}

/* ---------- home views ---------- */
function matchCard(label, a, b, m, fid){
  const ta = tm(a), tb = tm(b);
  let tag = "", mid = "", btn = "";
  if (!m){
    tag = `<span class="tag">UPCOMING</span>`;
    btn = `<button class="btn" onclick="startSheet('${fid}')">Start match</button>`;
  } else {
    const live = m.phase !== "done";
    tag = `<span class="tag ${live?"live":"done"}">${live?"LIVE":"FINISHED"}</span>`;
    mid = m.inn.map(i => `<div class="line"><span>${esc(m.teams[i.bat])}</span><b>${i.runs}/${i.wkts} (${oversStr(i.balls)})</b></div>`).join("")
        + (m.phase === "done" ? `<div class="line"><b>${esc(m.result)}</b></div>` : "");
    btn = `<button class="btn ${live?"":"ghost"}" onclick="openMatch('${m.id}')">${live?"Resume scoring":"View scorecard"}</button>`;
  }
  return `<div class="card fx"><div class="fx-top"><b>${esc(label)}</b>${tag}</div>
    <div class="vs"><b style="color:${ta.color}">${esc(ta.name)}</b><i>vs</i><b style="color:${tb.color}">${esc(tb.name)}</b></div>
    ${mid}${btn}</div>`;
}
function matchesView(){
  const fx = DB.fixtures.map(f => matchCard(f.label, f.a, f.b, DB.matches.find(m => m.fid === f.id), f.id)).join("");
  const extra = DB.matches.filter(m => !m.fid).slice().reverse()
    .map((m,n) => matchCard("Friendly " + (DB.matches.filter(x=>!x.fid).length - n), m.teamIds[0], m.teamIds[1], m)).join("");
  return `<main><h2>Schedule</h2>${fx}
    ${extra ? `<h2>Other matches</h2>${extra}` : ""}
    <button class="btn ghost" onclick="startSheet('')">＋ New match</button></main>`;
}
function teamsView(){
  return `<main>${DB.teams.map((t,n) => `<div class="card">
    <div class="tr"><div><b style="color:${t.color};font-size:17px">${esc(t.name)}</b><div class="sub">${esc(t.tag||"")} · ${t.players.length} players</div></div>
    <button class="btn ghost sm" onclick="teamSheet(${n})">Edit</button></div>
    <div class="plist">${t.players.map((p,k) => `<span class="${k===0?"c":""}">${esc(p)}${k===0?" (c)":""}</span>`).join("")}</div></div>`).join("")}
    <button class="btn ghost" onclick="teamSheet(-1)">＋ Add team</button></main>`;
}
function tableView(){
  const rows = standings();
  return `<main><div class="card"><h2>Points table</h2>
    <table><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>NRR</th><th>Pts</th></tr>
    ${rows.map(r => `<tr><td class="n" style="color:${tm(r.id).color}">${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.t}</td>
      <td>${(r.nrr>=0?"+":"")+r.nrr.toFixed(2)}</td><td class="pts">${r.pts}</td></tr>`).join("")}</table>
    <div class="sub" style="margin-top:8px">Win = 2 pts, tie = 1 pt. Finished matches only.</div></div></main>`;
}

function teamSheet(n){
  const t = n >= 0 ? tm(n) : {name:"", tag:"", color:"#3ddc84", players:[]};
  const used = n >= 0 && (DB.matches.some(m => m.teamIds.includes(n)) || DB.fixtures.some(f => f.a === n || f.b === n));
  openSheet(`<h3>${n >= 0 ? "Edit team" : "New team"}</h3>
    <form onsubmit="saveTeam(event,${n})">
      <label>Team name</label><input name="name" value="${esc(t.name)}" required autocomplete="off">
      <label>Subtitle (optional)</label><input name="tag" value="${esc(t.tag||"")}" autocomplete="off">
      <label>Colour</label><input name="color" type="color" value="${t.color}" style="height:46px;padding:4px">
      <label>Players — one per line, first is captain</label>
      <textarea name="players">${esc(t.players.join("\n"))}</textarea>
      <div class="sub" style="margin-top:6px">Changes apply to matches started afterwards.</div>
      <div class="opts"><button class="btn" type="submit">Save</button>
      ${n >= 0 && !used ? `<button class="btn danger" type="button" onclick="delTeam(${n})">Delete team</button>` : ""}
      <button class="btn ghost" type="button" onclick="closeSheet()">Cancel</button></div>
    </form>`);
}
function saveTeam(e, n){
  e.preventDefault();
  const f = new FormData(e.target);
  const t = { name:f.get("name").trim(), tag:f.get("tag").trim(), color:f.get("color"),
    players: f.get("players").split("\n").map(x => x.trim()).filter(Boolean) };
  if (n >= 0) DB.teams[n] = t; else DB.teams.push(t);
  closeSheet(); render();
}
function delTeam(n){
  DB.teams.splice(n, 1);
  DB.fixtures.forEach(f => { if (f.a > n) f.a--; if (f.b > n) f.b--; });
  DB.matches.forEach(m => m.teamIds = m.teamIds.map(x => x > n ? x - 1 : x));
  closeSheet(); render();
}

/* ---------- match views ---------- */
function ballChips(tokens){
  return tokens.map(t => {
    let c = "b";
    if (t.includes("W")) c += " w";
    else if (/wd|nb|b$|lb$/.test(t)) c += " x";
    else if (t === "4") c += " f";
    else if (t === "6") c += " s";
    return `<span class="${c}">${esc(t)}</span>`;
  }).join("");
}

function scoreView(){
  const i = inn(), tgt = S.cur === 1 ? S.inn[0].runs + 1 : null;
  const left = S.overs*6 - i.balls;
  let chase = "";
  if (tgt && !i.ended){
    const need = tgt - i.runs;
    chase = `<div class="chase">Need <b>${need}</b> from <b>${left}</b> balls · RRR <b>${rate(need,left)}</b></div>`;
  } else if (S.cur === 0 && !i.ended){
    chase = `<div class="chase">Projected <b>${Math.round(i.balls ? i.runs*S.overs*6/i.balls : 0)}</b> at current rate</div>`;
  }
  const o = i.ov[i.ov.length-1];
  const cur = o && !o.closed ? o.t : [];
  const sb = i.striker && getBatter(i, i.striker), nb = i.non && getBatter(i, i.non), bw = i.bowler && getBowler(i, i.bowler);
  const batRow = (p, star) => p ? `<tr><td class="n ${star?'strike':''}">${esc(p.name)}${star?" *":""}</td><td>${p.r}</td><td>${p.b}</td><td>${p.f}</td><td>${p.s}</td><td>${sr(p.r,p.b)}</td></tr>` : "";

  const dis = i.ended || !i.striker || !i.non || !i.bowler;
  const d = dis ? "disabled" : "";
  const done = S.phase === "done" ? `<div class="result">${esc(S.result)}</div>` : "";
  const brk = S.phase === "break" ? `<div class="card"><h2>Innings break</h2>
      <div class="sub" style="margin-bottom:10px">${esc(bowlTeam(i))} need <b>${S.inn[0].runs+1}</b> to win from ${S.overs} overs.</div>
      <button class="btn" onclick="startSecond()">Start 2nd innings</button></div>` : "";

  return `<main>
    ${done}${brk}
    <div class="card score-card">
      <div class="team">${esc(batTeam(i))} · ${S.cur===0?"1st":"2nd"} innings</div>
      <div class="big">${i.runs}<small>/${i.wkts}</small></div>
      <div class="sub"><b>${oversStr(i.balls)}</b> / ${S.overs} ov · CRR <b>${rate(i.runs,i.balls)}</b>${tgt?` · Target <b>${tgt}</b>`:""}</div>
      ${chase}
      <div class="balls">${cur.length ? ballChips(cur) : '<span class="sub">New over</span>'}</div>
    </div>
    <div class="card">
      <table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
        ${batRow(sb,true)}${batRow(nb,false)}</table>
      <table style="margin-top:8px"><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>
        ${bw ? `<tr><td class="n">${esc(bw.name)}</td><td>${oversStr(bw.b)}</td><td>${bw.r}</td><td>${bw.w}</td><td>${rate(bw.r,bw.b)}</td></tr>` : ""}</table>
    </div>
    <div class="mods">
      ${[["wd","Wide"],["nb","No ball"],["b","Bye"],["lb","Leg bye"]].map(([k,l]) =>
        `<button class="chip ${mod===k?"on":""}" onclick="setMod('${k}')">${l}</button>`).join("")}
    </div>
    <div class="pad">
      ${[0,1,2,3].map(r => `<button ${d} onclick="ball(${r},mod)">${r}</button>`).join("")}
      <button ${d} class="four" onclick="ball(4,mod)">4</button>
      <button ${d} onclick="ball(5,mod)">5</button>
      <button ${d} class="six" onclick="ball(6,mod)">6</button>
      <button ${d} class="wk" onclick="wicketSheet()">W</button>
    </div>
    <div class="row2">
      <button class="btn ghost" onclick="undo()" ${hist.length?"":"disabled"}>↶ Undo</button>
      <button class="btn ghost" onclick="swapStrike()" ${d}>⇄ Swap strike</button>
    </div>
  </main>`;
}

function inningsCard(i){
  const ex = i.extras, exT = ex.wd + ex.nb + ex.b + ex.lb;
  return `<div class="card">
    <h2>${esc(batTeam(i))} · ${i.runs}/${i.wkts} (${oversStr(i.balls)} ov)</h2>
    <table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
      ${i.batters.map(p => `<tr><td class="n">${esc(p.name)}${(p.name===i.striker||p.name===i.non)&&!i.ended?" *":""}
        <span class="out">${p.out ? esc(p.out) : (i.ended?"not out":"batting")}</span></td>
        <td>${p.r}</td><td>${p.b}</td><td>${p.f}</td><td>${p.s}</td><td>${sr(p.r,p.b)}</td></tr>`).join("")}
    </table>
    <div class="sub" style="margin:8px 0">Extras <b>${exT}</b> (wd ${ex.wd}, nb ${ex.nb}, b ${ex.b}, lb ${ex.lb})</div>
    ${i.fow.length ? `<div class="fow"><b>Fall of wickets:</b> ${i.fow.map(esc).join(", ")}</div>` : ""}
    <table style="margin-top:12px"><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>
      ${i.bowlers.map(p => `<tr><td class="n">${esc(p.name)}</td><td>${oversStr(p.b)}</td><td>${p.r}</td><td>${p.w}</td><td>${rate(p.r,p.b)}</td></tr>`).join("")}
    </table></div>`;
}
function cardView(){
  return `<main>${S.phase==="done"?`<div class="result">${esc(S.result)}</div>`:""}
    ${S.inn.map(inningsCard).join("")}</main>`;
}
function oversView(){
  return `<main>${S.inn.map(i => `<div class="card"><h2>${esc(batTeam(i))}</h2>
    ${i.ov.length ? i.ov.map((o,n) => `<div class="over"><span class="no">${n+1}</span>
      <span class="who">${esc(o.bowler)}</span><div class="balls">${ballChips(o.t)}</div>
      <span class="tot">${o.runs}</span></div>`).join("") : '<div class="empty">No overs yet</div>'}
  </div>`).join("")}</main>`;
}

/* ---------- sheets ---------- */
function openSheet(html){ $("#modal").innerHTML = `<div class="scrim"><div class="sheet">${html}</div></div>`; }
function closeSheet(){ $("#modal").innerHTML = ""; }

function wicketSheet(){
  const i = inn();
  let rr = 0;
  window._wr = r => { rr = r; document.querySelectorAll("#wr button").forEach((b,n) => b.classList.toggle("on", n===r)); };
  window._wk = (how, who) => { closeSheet(); ball(rr, mod, {how, who}); };
  openSheet(`<h3>Wicket</h3><div class="sub">${mod?"With extra: "+mod.toUpperCase()+" · ":""}Runs scored on the ball:</div>
    <div class="runs" id="wr">${[0,1,2,3].map(r=>`<button class="chip ${r===0?"on":""}" onclick="_wr(${r})">${r}</button>`).join("")}</div>
    <div class="opts">
      ${["Bowled","Caught","LBW","Stumped","Hit wicket"].map(h=>`<button class="btn ghost" onclick="_wk('${h}','striker')">${h}</button>`).join("")}
      <button class="btn ghost" onclick="_wk('Run out','striker')">Run out · ${esc(i.striker)}</button>
      <button class="btn ghost" onclick="_wk('Run out','non')">Run out · ${esc(i.non)}</button>
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
    </div>`);
}

function menuSheet(){
  openSheet(`<h3>Match</h3><div class="opts">
    ${S.phase==="play" ? `<button class="btn ghost" onclick="closeSheet();confirmEnd()">End innings now</button>` : ""}
    <button class="btn danger" onclick="confirmDelete()">Delete this match</button>
    <button class="btn ghost" onclick="closeSheet()">Close</button></div>`);
}
function confirmEnd(){
  openSheet(`<h3>End innings?</h3><div class="sub">The innings will close with the current score.</div>
    <div class="opts"><button class="btn danger" onclick="closeSheet();snapshot();endInnings();render()">End innings</button>
    <button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
}
function confirmDelete(){
  openSheet(`<h3>Delete this match?</h3><div class="sub">Its scores will be lost${S.fid?" and the fixture goes back to upcoming":""}.</div>
    <div class="opts"><button class="btn danger" onclick="deleteMatch('${S.id}')">Delete match</button>
    <button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
}

/* Ask for whichever of striker / non-striker / bowler is missing, picked from the squads */
function ensurePlayers(){
  if (view !== "match" || S.phase !== "play") return;
  const i = inn();
  if (i.ended) return;
  const need = [];
  const bt = i.bat, bl = 1 - i.bat;
  const later = i.balls > 0 || i.wkts > 0;
  if (!i.striker) need.push(["striker", later ? "New batter" : "Striker", bt]);
  if (!i.non) need.push(["non", later ? "New batter" : "Non-striker", bt]);
  if (!i.bowler) need.push(["bowler", "Bowler", bl]);
  if (!need.length) return;

  const lastBowler = i.ov.length ? i.ov[i.ov.length-1].bowler : "";
  const busy = [i.striker, i.non].filter(Boolean);
  const out = i.batters.filter(p => p.out).map(p => p.name);
  const field = need.map(([k,label,team], n) => {
    const avail = S.squad[team].filter(x => k === "bowler" ? x !== lastBowler : !busy.includes(x) && !out.includes(x));
    const opts = avail.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("") + `<option value="__other">＋ Someone else…</option>`;
    return `<label>${label} · ${esc(S.teams[team])}</label>
      <select name="s${n}" onchange="document.getElementById('o${n}').style.display=this.value==='__other'?'block':'none'">${opts}</select>
      <input id="o${n}" name="o${n}" placeholder="Player name" autocomplete="off" style="display:${avail.length?"none":"block"};margin-top:6px">`;
  }).join("");

  window._pl = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const picks = need.map(([k,,team], n) => {
      let v = f.get("s"+n);
      if (v === "__other" || v == null) v = (f.get("o"+n) || "").trim() || (k === "bowler" ? "Bowler " + (i.bowlers.length+1) : "Batter " + (i.batters.length+1));
      return v;
    });
    const bats = need.map((x,n) => [x[0], picks[n]]).filter(x => x[0] !== "bowler").map(x => x[1]);
    if (new Set([...bats, ...busy]).size !== bats.length + busy.length){ alert("Pick two different batters."); return; }
    snapshot();
    need.forEach(([k], n) => { i[k] = picks[n]; if (k === "bowler") getBowler(i, picks[n]); else getBatter(i, picks[n]); });
    closeSheet(); render();
  };
  openSheet(`<h3>${need.length>1 ? "Select players" : need[0][1]}</h3>
    <form onsubmit="_pl(event)">${field}
      <div style="height:16px"></div><button class="btn" type="submit">Continue</button>
    </form>`);
}

/* ---------- shell ---------- */
function render(){
  save();
  let body, nav, title = `🏏 Mivoyage <span>Cricket</span>`, left = "", right = "";
  if (view === "home"){
    body = htab === "matches" ? matchesView() : htab === "teams" ? teamsView() : tableView();
    nav = [["matches","Matches"],["table","Table"],["teams","Teams"]].map(([k,l]) =>
      `<button class="${htab===k?"on":""}" onclick="htab='${k}';render()">${l}</button>`).join("");
  } else {
    body = tab === "score" ? scoreView() : tab === "card" ? cardView() : oversView();
    title = `${esc(S.teams[0])} <span>v</span> ${esc(S.teams[1])}`;
    left = `<button class="icon-btn" aria-label="Back" onclick="goHome()">←</button>`;
    right = `<button class="icon-btn" aria-label="Menu" onclick="menuSheet()">⋯</button>`;
    nav = [["score","Live"],["card","Scorecard"],["overs","Overs"]].map(([k,l]) =>
      `<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("");
  }
  $("#app").innerHTML = `<header>${left}<h1>${title}</h1>${right}</header>${body}<nav>${nav}</nav>`;
  if (!$("#modal").innerHTML) ensurePlayers();
}
render();
</script>
</body>
</html>
